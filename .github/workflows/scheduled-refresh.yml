name: Scheduled Data Refresh & Auto Deploy

on:
  schedule:
    # 매시간 정각 (0분) 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  # GitHub 웹 Actions 탭에서 Run workflow 버튼으로 즉시 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1. Refresh Four-Market Public Catalogs
        run: node scripts/refresh-public-snapshot.mjs

      - name: 2. Refresh KIS & OpenDART Official Signals
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_STOCK_CODE: ${{ secrets.KIS_STOCK_CODE || '134580' }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/refresh-official-signals.mjs

      - name: 3. Run Crosscheck & Live Verification
        run: node scripts/crosscheck.mjs --live --write

      - name: 4. Validate Integrity & Syntaxes
        run: node scripts/validate.mjs

      - name: 5. Build Public Distribution
        run: node scripts/build-public.mjs

      - name: 6. Commit & Push Changes to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/ dist-public/
          if git diff --cached --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(auto): hourly data refresh snapshot [skip ci]"
            git push origin HEAD:main
          fi