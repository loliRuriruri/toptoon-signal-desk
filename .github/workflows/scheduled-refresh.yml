name: Scheduled Data Refresh & Auto Deploy

on:
  schedule:
    # 15분마다 자동 실행 (정각 00/30분 트래픽 혼잡을 피해 7,22,37,52분에 실행)
    - cron: "7,22,37,52 * * * *"
  # GitHub 웹 Actions 탭에서 Run workflow 버튼으로 즉시 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1. Refresh Four-Market Public Catalogs
        run: node scripts/refresh-public-snapshot.mjs

      - name: 2. Refresh KIS & OpenDART Official Signals
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_STOCK_CODE: ${{ secrets.KIS_STOCK_CODE || '134580' }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/refresh-official-signals.mjs

      - name: 3. Run Crosscheck & Live Verification
        run: node scripts/crosscheck.mjs --live --write

      - name: 4. Validate Integrity & Syntaxes
        run: node scripts/validate.mjs

      - name: 5. Generate Scheduled Nemotron Diagnosis
        continue-on-error: true
        timeout-minutes: 7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          AI_DIAGNOSIS_MIN_HOURS: ${{ vars.AI_DIAGNOSIS_MIN_HOURS || '2' }}
        run: node scripts/generate-ai-diagnosis.mjs

      - name: 6. Build Public Distribution
        run: node scripts/build-public.mjs

      - name: 7. Commit & Push Changes to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          if git diff --cached --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(auto): scheduled data refresh snapshot"
            git push origin HEAD:main
          fi

      - name: 8. Deploy Public Distribution to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::Cloudflare deployment skipped: register CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets."
            exit 0
          fi

          npx --yes wrangler@4.127.0 pages deploy dist-public \
            --project-name=toptoon-signal-desk \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="$(git log -1 --pretty=%s)"
