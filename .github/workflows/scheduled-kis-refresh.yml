name: Scheduled KIS Stock Quote Refresh

on:
  schedule:
    # 한국투자증권(KIS) 1일 2회 평일 갱신 정책
    # 1차: KST 오전 10:00 = UTC 01:00 (월~금)
    - cron: "0 1 * * 1-5"
    # 2차: KST 오후 15:40 = UTC 06:40 (월~금, 장마감 확인)
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "휴장일/최소간격 무시하고 강제 KIS 조회"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scheduled-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-kis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1. Refresh KIS Official Signals
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_STOCK_CODE: ${{ secrets.KIS_STOCK_CODE || '134580' }}
          KIS_REFRESH_FORCE: ${{ inputs.force_refresh && '1' || '0' }}
        run: node scripts/refresh-official-signals.mjs --providers kis

      - name: 2. Run Crosscheck & Live Verification
        run: node scripts/crosscheck.mjs --live --write

      - name: 3. Validate Integrity & Syntaxes
        run: node scripts/validate.mjs

      - name: 4. Build Public Distribution
        run: node scripts/build-public.mjs

      - name: 5. Deploy Public Distribution to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing in GitHub repository settings."
            exit 1
          fi

          npx --yes wrangler@4.127.0 pages deploy dist-public \
            --project-name=toptoon-signal-desk \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="$(git log -1 --pretty=%s)"

      - name: 6. Commit & Push Changes to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          if git diff --cached --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(auto): scheduled KIS stock quote snapshot"
            git pull origin main --rebase -X theirs
            git push origin HEAD:main
          fi
